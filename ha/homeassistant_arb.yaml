# Home Assistant — Plan B 740 controller integration  (controller @ 192.168.10.101:8677)
#
# MERGE into /config/configuration.yaml by top-level key (you already have some of these):
#   rest_command:   -> you don't have one; paste whole
#   rest:           -> add the `- resource:` item under your EXISTING rest: list
#   template:       -> add the `- binary_sensor:` item under your EXISTING template: list
#   input_datetime: / input_number: / automation:  -> merge under those keys (or add if absent)
# secrets.yaml:  arb_token_bearer: "Bearer <ARB_TOKEN from the Pi's ~/.env>"
# Then restart HA.

rest_command:
  arb_open:   {url: "http://192.168.10.101:8677/open",  method: POST, headers: {authorization: !secret arb_token_bearer}}
  arb_close:  {url: "http://192.168.10.101:8677/close", method: POST, headers: {authorization: !secret arb_token_bearer}}
  arb_auto:   {url: "http://192.168.10.101:8677/auto",  method: POST, headers: {authorization: !secret arb_token_bearer}}
  arb_config:
    url: "http://192.168.10.101:8677/config"
    method: POST
    headers: {authorization: !secret arb_token_bearer, content-type: application/json}
    payload: >-
      {"peak_start": "{{ states('input_datetime.arb_island_time')[:5] }}",
       "peak_end": "{{ states('input_datetime.arb_grid_time')[:5] }}",
       "floor_pct": {{ states('input_number.arb_floor_pct') | int(10) }}}

# ── add under existing `rest:` ─────────────────────────────────────────────
  - resource: "http://192.168.10.101:8677/state"
    method: GET
    headers: {authorization: !secret arb_token_bearer}
    scan_interval: 15
    sensor:
      - {name: "Arb 740 position", unique_id: arb_position, value_template: "{{ value_json.position }}"}
      - {name: "Arb 740 mode",     unique_id: arb_mode,     value_template: "{{ value_json.mode }}"}
      # live times the controller is ACTUALLY running on (read-back confirmation):
      - {name: "Arb 740 island at", unique_id: arb_peak_start, value_template: "{{ value_json.peak_start }}"}
      - {name: "Arb 740 grid at",   unique_id: arb_peak_end,   value_template: "{{ value_json.peak_end }}"}
    # SOC: reuse sensor.powerwall_battery (proxy). Controller reads SOC internally for the floor.

# ── add under existing `template:` ─────────────────────────────────────────
  - sensor:
      # plain-text grid state so the card reads clearly (not On/Off)
      - name: "Arb grid link"
        unique_id: arb_grid_link
        state: "{{ 'Off-grid (on battery)' if is_state('sensor.arb_740_position','open') else 'On grid' }}"
  - binary_sensor:
      - {name: "Arb Islanded", unique_id: arb_islanded, state: "{{ states('sensor.arb_740_position') == 'open' }}"}
      - {name: "Arb Manual Override", unique_id: arb_manual, state: "{{ states('sensor.arb_740_mode') == 'manual' }}"}

# ── setpoints (editable in HA) ─────────────────────────────────────────────
input_datetime:
  arb_island_time: {name: "Island on (paid start)", has_date: false, has_time: true}
  arb_grid_time:   {name: "Grid on (free start)",   has_date: false, has_time: true}
input_number:
  arb_floor_pct:   {name: "Discharge floor", min: 0, max: 50, step: 1, unit_of_measurement: "%"}

# ── push setpoints to the controller on change + on HA start ───────────────
automation:
  - alias: "Arb push config"
    trigger:
      - platform: state
        entity_id: [input_datetime.arb_island_time, input_datetime.arb_grid_time, input_number.arb_floor_pct]
      - platform: homeassistant
        event: start
    action:
      - delay: "00:00:05"
      - service: rest_command.arb_config

