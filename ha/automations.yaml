- alias: "Arb push config on HA start"
  trigger:
    - platform: homeassistant
      event: start
  action:
    - delay: "00:00:10"
    - service: rest_command.arb_config

- id: '1698885446051'
  alias: Pool-Cold Temp
  description: ''
  triggers:
  - entity_id:
    - weather.forecast_home
    attribute: temperature
    below: 34
    trigger: numeric_state
  conditions: []
  actions:
  - data: {}
    action: switch.turn_on
    target:
      entity_id: switch.mainpool
  mode: single

- id: tou_tariff_switch
  alias: "TOU tariff switch"
  trigger:
    - platform: time
      at: "09:00:00"
    - platform: time
      at: "17:00:00"
    - platform: homeassistant
      event: start
  action:
    - variables:
        tar: "{{ 'free' if (9 <= now().hour < 17) else 'peak' }}"
    - service: select.select_option
      target:
        entity_id:
          - select.grid_import_tou
          - select.battery_discharge_tou
          - select.battery_discharge_daily
      data:
        option: "{{ tar }}"
