esphome:
  name: emporia-3
  friendly_name: Generation Panel

external_components:
  - source: github://emporia-vue-local/esphome@dev
    components:
      - emporia_vue

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

logger:
  logs:
    sensor: INFO
api:
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

preferences:
  # the default of 1min is far too short--flash chip is rated
  # for approx 100k writes.
  flash_write_interval: "48h"

i2c:
  sda:
    number: 5
    ignore_strapping_warning: true
  scl: 18
  scan: false
  frequency: 400kHz
  timeout: 1ms
  id: i2c_a

switch:
  - platform: restart
    name: Restart

time:
  - platform: homeassistant

light:
  - platform: status_led
    id: wifi_led
    pin:
      number: 2
      ignore_strapping_warning: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: status_led
    id: ethernet_led
    pin: 4
    restore_mode: ALWAYS_OFF

# these are called references in YAML. They allow you to reuse
# this configuration in each sensor, while only defining it once
.defaultfilters:
  - &moving_avg
    # we capture a new sample every 0.24 seconds, so the time can
    # be calculated from the number of samples as n * 0.24.
    sliding_window_moving_average:
      # we average over the past 2.88 seconds
      window_size: 24
      # we push a new value every 1.44 seconds
      send_every: 12
  - &invert
    # invert and filter out any values below 0.
    lambda: 'return max(-x, 0.0f);'
  - &pos
    # filter out any values below 0.
    lambda: 'return max(x, 0.0f);'
  - &abs
    # take the absolute value of the value
    lambda: 'return abs(x);'

sensor:
  - platform: emporia_vue
    variant: vue3
    i2c_id: i2c_a
    phases:
      - id: phase_a  # Verify that this phase/leg matches the wire color on the device
        input: BLACK  # Vue device wire color
        calibration: 0.0194  # tune: <in-use calibration> * <accurate voltage> / <reporting voltage>
        voltage:
          name: "Phase R Voltage"
          filters: [*moving_avg, *pos]
      - id: phase_b  # Verify that this phase/leg matches the wire color on the device
        input: RED  # Vue device wire color
        calibration: 0.0194
        voltage:
          name: "Phase L Voltage"
          filters: [*moving_avg, *pos]
    ct_clamps:
      # --- Gen panel: main CTs A/B on the two hot 1/0 conductors of the 150A feeder ---
      # SIGNED power (no *pos). Arrows point toward the backup panel:
      #   positive = batteries discharging into the house, negative = house charging the batteries.
      - phase_id: phase_a
        input: "A"  # Verify the CT going to this input matches the phase/leg
        power:
          name: "Phase R Power"
          id: phase_a_power
          device_class: power
          filters: [*moving_avg]
      - phase_id: phase_b
        input: "B"  # Verify the CT going to this input matches the phase/leg
        power:
          name: "Phase L Power"
          id: phase_b_power
          device_class: power
          filters: [*moving_avg]
      # --- Gen panel: CT input N -> Powerwall N (30A 2P breaker), signed ---
      # phase_id = the leg of the conductor each CT is clamped on (verify with a meter).
      # 2-pole (240V) circuits: one CT on one hot, so multiply: 2. Arrows point away from the Powerwall.
      - { phase_id: phase_a, input: "1", power: { name: "Powerwall 1", id: pw1, device_class: power, filters: [ *moving_avg, multiply: 2 ] } }
      - { phase_id: phase_a, input: "2", power: { name: "Powerwall 2", id: pw2, device_class: power, filters: [ *moving_avg, multiply: 2 ] } }
      - { phase_id: phase_a, input: "3", power: { name: "Powerwall 3", id: pw3, device_class: power, filters: [ *moving_avg, multiply: 2 ] } }
      - { phase_id: phase_a, input: "4", power: { name: "Powerwall 4", id: pw4, device_class: power, filters: [ *moving_avg, multiply: 2 ] } }
      - { phase_id: phase_a, input: "5", power: { name: "Powerwall 5", id: pw5, device_class: power, filters: [ *moving_avg, multiply: 2 ] } }
  - platform: template
    name: "Total Power"
    lambda: return id(phase_a_power).state + id(phase_b_power).state;
    update_interval: 10s
    id: total_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
  - platform: template
    name: "Total Discharge Power"
    lambda: |-
      if (isnan(id(total_power).state)) return NAN;
      return max(id(total_power).state, 0.0f);
    update_interval: 10s
    id: total_discharge_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
  - platform: template
    name: "Total Charge Power"
    lambda: |-
      if (isnan(id(total_power).state)) return NAN;
      return max(-id(total_power).state, 0.0f);
    update_interval: 10s
    id: total_charge_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
  - platform: template
    name: "Powerwalls Total Power"
    lambda: return id(pw1).state + id(pw2).state + id(pw3).state + id(pw4).state + id(pw5).state;
    update_interval: 10s
    id: pw_total_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
  - platform: total_daily_energy
    name: "Total Discharge Daily Energy"
    power_id: total_discharge_power
    accuracy_decimals: 0
  - platform: total_daily_energy
    name: "Total Charge Daily Energy"
    power_id: total_charge_power
    accuracy_decimals: 0
  - { platform: template, id: pw1_dis, name: "Powerwall 1 Discharge", lambda: "if (isnan(id(pw1).state)) return NAN; return max(id(pw1).state, 0.0f);", update_interval: 10s, unit_of_measurement: "W", device_class: power, state_class: measurement }
  - { platform: template, id: pw1_chg, name: "Powerwall 1 Charge", lambda: "if (isnan(id(pw1).state)) return NAN; return max(-id(pw1).state, 0.0f);", update_interval: 10s, unit_of_measurement: "W", device_class: power, state_class: measurement }
  - { platform: template, id: pw2_dis, name: "Powerwall 2 Discharge", lambda: "if (isnan(id(pw2).state)) return NAN; return max(id(pw2).state, 0.0f);", update_interval: 10s, unit_of_measurement: "W", device_class: power, state_class: measurement }
  - { platform: template, id: pw2_chg, name: "Powerwall 2 Charge", lambda: "if (isnan(id(pw2).state)) return NAN; return max(-id(pw2).state, 0.0f);", update_interval: 10s, unit_of_measurement: "W", device_class: power, state_class: measurement }
  - { platform: template, id: pw3_dis, name: "Powerwall 3 Discharge", lambda: "if (isnan(id(pw3).state)) return NAN; return max(id(pw3).state, 0.0f);", update_interval: 10s, unit_of_measurement: "W", device_class: power, state_class: measurement }
  - { platform: template, id: pw3_chg, name: "Powerwall 3 Charge", lambda: "if (isnan(id(pw3).state)) return NAN; return max(-id(pw3).state, 0.0f);", update_interval: 10s, unit_of_measurement: "W", device_class: power, state_class: measurement }
  - { platform: template, id: pw4_dis, name: "Powerwall 4 Discharge", lambda: "if (isnan(id(pw4).state)) return NAN; return max(id(pw4).state, 0.0f);", update_interval: 10s, unit_of_measurement: "W", device_class: power, state_class: measurement }
  - { platform: template, id: pw4_chg, name: "Powerwall 4 Charge", lambda: "if (isnan(id(pw4).state)) return NAN; return max(-id(pw4).state, 0.0f);", update_interval: 10s, unit_of_measurement: "W", device_class: power, state_class: measurement }
  - { platform: template, id: pw5_dis, name: "Powerwall 5 Discharge", lambda: "if (isnan(id(pw5).state)) return NAN; return max(id(pw5).state, 0.0f);", update_interval: 10s, unit_of_measurement: "W", device_class: power, state_class: measurement }
  - { platform: template, id: pw5_chg, name: "Powerwall 5 Charge", lambda: "if (isnan(id(pw5).state)) return NAN; return max(-id(pw5).state, 0.0f);", update_interval: 10s, unit_of_measurement: "W", device_class: power, state_class: measurement }
  - { power_id: pw1_dis, platform: total_daily_energy, accuracy_decimals: 0, name: "Powerwall 1 Discharge Daily Energy" }
  - { power_id: pw1_chg, platform: total_daily_energy, accuracy_decimals: 0, name: "Powerwall 1 Charge Daily Energy" }
  - { power_id: pw2_dis, platform: total_daily_energy, accuracy_decimals: 0, name: "Powerwall 2 Discharge Daily Energy" }
  - { power_id: pw2_chg, platform: total_daily_energy, accuracy_decimals: 0, name: "Powerwall 2 Charge Daily Energy" }
  - { power_id: pw3_dis, platform: total_daily_energy, accuracy_decimals: 0, name: "Powerwall 3 Discharge Daily Energy" }
  - { power_id: pw3_chg, platform: total_daily_energy, accuracy_decimals: 0, name: "Powerwall 3 Charge Daily Energy" }
  - { power_id: pw4_dis, platform: total_daily_energy, accuracy_decimals: 0, name: "Powerwall 4 Discharge Daily Energy" }
  - { power_id: pw4_chg, platform: total_daily_energy, accuracy_decimals: 0, name: "Powerwall 4 Charge Daily Energy" }
  - { power_id: pw5_dis, platform: total_daily_energy, accuracy_decimals: 0, name: "Powerwall 5 Discharge Daily Energy" }
  - { power_id: pw5_chg, platform: total_daily_energy, accuracy_decimals: 0, name: "Powerwall 5 Charge Daily Energy" }
