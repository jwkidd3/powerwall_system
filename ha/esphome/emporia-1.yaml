esphome:
  name: backup-panel
  friendly_name: Backup Panel

external_components:
  - source: github://emporia-vue-local/esphome@dev
    components:
      - emporia_vue

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

logger:
  logs:
    sensor: INFO
api:
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

preferences:
  # the default of 1min is far too short--flash chip is rated
  # for approx 100k writes.
  flash_write_interval: "48h"

i2c:
  sda:
    number: 5
    ignore_strapping_warning: true
  scl: 18
  scan: false
  frequency: 400kHz
  timeout: 1ms
  id: i2c_a

switch:
  - platform: restart
    name: Restart

time:
  - platform: homeassistant

light:
  - platform: status_led
    id: wifi_led
    pin:
      number: 2
      ignore_strapping_warning: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: status_led
    id: ethernet_led
    pin: 4
    restore_mode: ALWAYS_OFF

# these are called references in YAML. They allow you to reuse
# this configuration in each sensor, while only defining it once
.defaultfilters:
  - &moving_avg
    # we capture a new sample every 0.24 seconds, so the time can
    # be calculated from the number of samples as n * 0.24.
    sliding_window_moving_average:
      # we average over the past 2.88 seconds
      window_size: 24
      # we push a new value every 1.44 seconds
      send_every: 12
  - &invert
    # invert and filter out any values below 0.
    lambda: 'return max(-x, 0.0f);'
  - &pos
    # filter out any values below 0.
    lambda: 'return max(x, 0.0f);'
  - &abs
    # take the absolute value of the value
    lambda: 'return abs(x);'

sensor:
  - platform: emporia_vue
    variant: vue3
    i2c_id: i2c_a
    phases:
      - id: phase_a  # Verify that this phase/leg matches the wire color on the device
        input: BLACK  # Vue device wire color
        calibration: 0.0194  # tune: <in-use calibration> * <accurate voltage> / <reporting voltage>
        voltage:
          name: "Phase R Voltage"
          filters: [*moving_avg, *pos]
      - id: phase_b  # Verify that this phase/leg matches the wire color on the device
        input: RED  # Vue device wire color
        calibration: 0.0194
        voltage:
          name: "Phase L Voltage"
          filters: [*moving_avg, *pos]
    ct_clamps:
      - phase_id: phase_a
        input: "A"  # Verify the CT going to this input matches the phase/leg
        power:
          name: "Phase R Power"
          id: phase_a_power
          device_class: power
          filters: [*moving_avg, *pos]
      - phase_id: phase_b
        input: "B"  # Verify the CT going to this input matches the phase/leg
        power:
          name: "Phase L Power"
          id: phase_b_power
          device_class: power
          filters: [*moving_avg, *pos]
      # --- Backup panel: CT input N -> circuit # per the panel directory ---
      # phase_id = the leg of the conductor each CT is clamped on (verify with a meter).
      # 2-pole (240V) circuits: one CT on one hot, so multiply: 2.
      - { phase_id: phase_a, input: "1", power: { name: "Circuit 2 Garage plugs", id: cir2, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_b, input: "2", power: { name: "Circuit 3 MWBC (CAFI)", id: cir3, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_b, input: "3", power: { name: "Circuit 4 Kitchen outlets", id: cir4, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_a, input: "4", power: { name: "Circuit 5 Bedroom 1 & 2", id: cir5, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_a, input: "5", power: { name: "Circuit 6 Dining / front room", id: cir6, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_b, input: "6", power: { name: "Circuit 7 Lights + plugs, garage", id: cir7, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_a, input: "7", power: { name: "Circuit 10 Kitchen lights", id: cir10, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_b, input: "8", power: { name: "Circuit 12 Mud room plugs", id: cir12, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_a, input: "9", power: { name: "Circuit 13 Master BR", id: cir13, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_a, input: "10", power: { name: "Circuit 14 Kitchen island", id: cir14, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_b, input: "11", power: { name: "Circuit 15 Office", id: cir15, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_b, input: "12", power: { name: "Circuit 16 Internet", id: cir16, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_b, input: "13", power: { name: "Circuit 19 Washroom plugs", id: cir19, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_b, input: "14", power: { name: "Circuit 20 Upstairs bath", id: cir20, filters: [ *moving_avg, *pos ] } }
      - { phase_id: phase_a, input: "15", power: { name: "Circuit 21 Downstairs Air", id: cir21, filters: [ *moving_avg, *pos, multiply: 2 ] } }
      - { phase_id: phase_a, input: "16", power: { name: "Circuit 22 Upstairs Air", id: cir22, filters: [ *moving_avg, *pos, multiply: 2 ] } }
  - platform: template
    name: "Total Power"
    lambda: return id(phase_a_power).state + id(phase_b_power).state;
    update_interval: 10s
    id: total_power
    unit_of_measurement: "W"
  - platform: total_daily_energy
    name: "Total Daily Energy"
    power_id: total_power
    accuracy_decimals: 0
  - { power_id: cir2, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 2 Garage plugs Daily Energy" }
  - { power_id: cir3, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 3 MWBC (CAFI) Daily Energy" }
  - { power_id: cir4, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 4 Kitchen outlets Daily Energy" }
  - { power_id: cir5, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 5 Bedroom 1 & 2 Daily Energy" }
  - { power_id: cir6, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 6 Dining / front room Daily Energy" }
  - { power_id: cir7, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 7 Lights + plugs, garage Daily Energy" }
  - { power_id: cir10, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 10 Kitchen lights Daily Energy" }
  - { power_id: cir12, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 12 Mud room plugs Daily Energy" }
  - { power_id: cir13, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 13 Master BR Daily Energy" }
  - { power_id: cir14, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 14 Kitchen island Daily Energy" }
  - { power_id: cir15, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 15 Office Daily Energy" }
  - { power_id: cir16, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 16 Internet Daily Energy" }
  - { power_id: cir19, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 19 Washroom plugs Daily Energy" }
  - { power_id: cir20, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 20 Upstairs bath Daily Energy" }
  - { power_id: cir21, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 21 Downstairs Air Daily Energy" }
  - { power_id: cir22, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 22 Upstairs Air Daily Energy" }
