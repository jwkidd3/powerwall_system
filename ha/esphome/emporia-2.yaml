esphome:
  name: emporia-2
  friendly_name: Non-Backup Panel

external_components:
  - source: github://emporia-vue-local/esphome@dev
    components:
      - emporia_vue

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

logger:
  logs:
    sensor: INFO
api:
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

preferences:
  # the default of 1min is far too short--flash chip is rated
  # for approx 100k writes.
  flash_write_interval: "48h"

i2c:
  sda:
    number: 5
    ignore_strapping_warning: true
  scl: 18
  scan: false
  frequency: 400kHz
  timeout: 1ms
  id: i2c_a

switch:
  - platform: restart
    name: Restart

time:
  - platform: homeassistant

light:
  - platform: status_led
    id: wifi_led
    pin:
      number: 2
      ignore_strapping_warning: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: status_led
    id: ethernet_led
    pin: 4
    restore_mode: ALWAYS_OFF

# these are called references in YAML. They allow you to reuse
# this configuration in each sensor, while only defining it once
.defaultfilters:
  - &moving_avg
    # we capture a new sample every 0.24 seconds, so the time can
    # be calculated from the number of samples as n * 0.24.
    sliding_window_moving_average:
      # we average over the past 2.88 seconds
      window_size: 24
      # we push a new value every 1.44 seconds
      send_every: 12
  - &invert
    # invert and filter out any values below 0.
    lambda: 'return max(-x, 0.0f);'
  - &pos
    # filter out any values below 0.
    lambda: 'return max(x, 0.0f);'
  - &abs
    # take the absolute value of the value
    lambda: 'return abs(x);'

sensor:
  - platform: emporia_vue
    variant: vue3
    i2c_id: i2c_a
    phases:
      - id: phase_a  # Verify that this phase/leg matches the wire color on the device
        input: BLACK  # Vue device wire color
        calibration: 0.0194  # tune: <in-use calibration> * <accurate voltage> / <reporting voltage>
        voltage:
          name: "Phase R Voltage"
          filters: [*moving_avg, *pos]
      - id: phase_b  # Verify that this phase/leg matches the wire color on the device
        input: RED  # Vue device wire color
        calibration: 0.0194
        voltage:
          name: "Phase L Voltage"
          filters: [*moving_avg, *pos]
    ct_clamps:
      - phase_id: phase_a
        input: "A"  # Verify the CT going to this input matches the phase/leg
        power:
          name: "Phase R Power"
          id: phase_a_power
          device_class: power
          filters: [*moving_avg, *pos]
      - phase_id: phase_b
        input: "B"  # Verify the CT going to this input matches the phase/leg
        power:
          name: "Phase L Power"
          id: phase_b_power
          device_class: power
          filters: [*moving_avg, *pos]
      # --- Non-backup panel: CT input N -> circuit # per the panel directory ---
      # phase_id = the leg of the conductor each CT is clamped on (verify with a meter).
      # 2-pole (240V) circuits: one CT on one hot, so multiply: 2.
      - { phase_id: phase_a, input: "1", power: { name: "Circuit 8 Pool pump", id: cir8, filters: [ *moving_avg, *pos, multiply: 2 ] } }
      - { phase_id: phase_a, input: "2", power: { name: "Circuit 9 EV charger", id: cir9, filters: [ *moving_avg, *pos, multiply: 2 ] } }
      - { phase_id: phase_a, input: "3", power: { name: "Circuit 11 Dryer", id: cir11, filters: [ *moving_avg, *pos, multiply: 2 ] } }
      - { phase_id: phase_a, input: "4", power: { name: "Circuit 23 Sunroom mini-split", id: cir23, filters: [ *moving_avg, *pos, multiply: 2 ] } }
  - platform: template
    name: "Total Power"
    lambda: return id(phase_a_power).state + id(phase_b_power).state;
    update_interval: 10s
    id: total_power
    unit_of_measurement: "W"
  - platform: total_daily_energy
    name: "Total Daily Energy"
    power_id: total_power
    accuracy_decimals: 0
  - { power_id: cir8, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 8 Pool pump Daily Energy" }
  - { power_id: cir9, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 9 EV charger Daily Energy" }
  - { power_id: cir11, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 11 Dryer Daily Energy" }
  - { power_id: cir23, platform: total_daily_energy, accuracy_decimals: 0, name: "Circuit 23 Sunroom mini-split Daily Energy" }
