# Home Assistant configuration.yaml — cleaned (duplicate keys removed)
# Changes vs your version:
#   - merged the TWO rest_command: blocks into one (arb_config was being erased)
#   - removed the duplicate /state rest resource; added island-at/grid-at read-back sensors
#   - removed the duplicate template binary_sensor block
#   - "Arb push config" automation goes in automations.yaml (see note at bottom)

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

homeassistant:
  packages: !include_dir_named packages

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

input_datetime:
  arb_island_time: {name: "Island on (paid start)", has_date: false, has_time: true}
  arb_grid_time:   {name: "Grid on (free start)",   has_date: false, has_time: true}
input_number:
  arb_floor_pct:   {name: "Discharge floor", min: 0, max: 50, step: 1, unit_of_measurement: "%"}
  arb_paid_rate:   {name: "Paid rate", min: 0, max: 1, step: 0.001, unit_of_measurement: "USD/kWh", mode: box}
  arb_free_rate:   {name: "Free rate", min: 0, max: 1, step: 0.001, unit_of_measurement: "USD/kWh", mode: box}

# ── ONE rest_command block (all four commands) ─────────────────────────────
rest_command:
  arb_open:
    url: "http://192.168.10.101:8677/open"
    method: POST
    headers: {authorization: !secret arb_token_bearer}
  arb_close:
    url: "http://192.168.10.101:8677/close"
    method: POST
    headers: {authorization: !secret arb_token_bearer}
  arb_auto:
    url: "http://192.168.10.101:8677/auto"
    method: POST
    headers: {authorization: !secret arb_token_bearer}
  arb_config:
    url: "http://192.168.10.101:8677/config"
    method: POST
    headers: {authorization: !secret arb_token_bearer, content-type: application/json}
    payload: >-
      {"peak_start": "{{ states('input_datetime.arb_island_time')[:5] }}",
       "peak_end": "{{ states('input_datetime.arb_grid_time')[:5] }}",
       "floor_pct": {{ states('input_number.arb_floor_pct') | int(10) }}}

rest:
  # ── 740 controller state (ONE block; includes live time read-back) ────────
  - resource: "http://192.168.10.101:8677/state"
    method: GET
    headers: {authorization: !secret arb_token_bearer}
    scan_interval: 15
    sensor:
      - {name: "Arb 740 position",  unique_id: arb_position,   value_template: "{{ value_json.position }}"}
      - {name: "Arb 740 mode",      unique_id: arb_mode,       value_template: "{{ value_json.mode }}"}
      - {name: "Arb 740 island at", unique_id: arb_peak_start, value_template: "{{ value_json.peak_start }}"}
      - {name: "Arb 740 grid at",   unique_id: arb_peak_end,   value_template: "{{ value_json.peak_end }}"}

  - resource: "https://www.ercot.com/api/1/services/read/dashboards/daily-prc.json"
    scan_interval: 300
    timeout: 60
    sensor:
      - name: "Ercot Status"
        unique_id: ercot_status
        icon: mdi:transmission-tower
        value_template: >
          {{ value_json.get('current_condition', {}).get('state', 'unknown') }}
        json_attributes_path: "$.current_condition"
        json_attributes:
          - energy_level_value
          - title
          - condition_note
          - eea_level
          - prc_value
      - name: "Grid Operating Reserves"
        unique_id: ercot_prc
        unit_of_measurement: "MW"
        state_class: measurement
        icon: mdi:flash
        value_template: >
          {{ value_json.get('current_condition', {}).get('prc_value', '0') | replace(',', '') | int(0) }}

  - resource: http://192.168.10.101:8675/api/meters/aggregates
    scan_interval: 30
    timeout: 5
    sensor:
      - name: "Powerwall Grid Power"
        unique_id: pw_site_power
        value_template: "{{ value_json.site.instant_power | round(0) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: "Powerwall Home Load"
        unique_id: pw_load_power
        value_template: "{{ value_json.load.instant_power | round(0) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: "Powerwall Battery Power"
        unique_id: pw_battery_power
        value_template: "{{ value_json.battery.instant_power | round(0) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement

  - resource: http://192.168.10.101:8675/api/system_status/soe
    scan_interval: 65
    timeout: 5
    sensor:
      - name: "Powerwall Battery"
        unique_id: pw_battery_soc
        value_template: "{{ value_json.percentage | round(1) }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement

  - resource: http://192.168.10.101:8675/api/system_status/grid_status
    scan_interval: 125
    timeout: 5
    sensor:
      - name: "Powerwall Grid Status"
        unique_id: pw_grid_status
        value_template: "{{ 'On Grid' if value_json.grid_status == 'SystemGridConnected' else 'Off Grid' }}"

  - resource: http://192.168.10.101:8675/pod
    scan_interval: 70
    timeout: 5
    sensor:
      - name: "Powerwall Energy Remaining"
        unique_id: pw_energy_remaining
        value_template: "{{ (value_json.nominal_energy_remaining | float(0) / 1000) | round(1) }}"
        unit_of_measurement: kWh
        device_class: energy_storage
        state_class: measurement
      - name: "Powerwall Full Pack Energy"
        unique_id: pw_full_pack_energy
        value_template: "{{ (value_json.nominal_full_pack_energy | float(0) / 1000) | round(1) }}"
        unit_of_measurement: kWh
        device_class: energy_storage
        state_class: measurement
      - name: "Powerwall Reserve"
        unique_id: pw_reserve_percent
        value_template: "{{ value_json.backup_reserve_percent | round(0) }}"
        unit_of_measurement: "%"

  # Per-Powerwall status. State = OK / FAULT; every flag is also an attribute (shown on the Powerwall dashboard).
  - resource: http://192.168.10.101:8675/pod
    scan_interval: 60
    timeout: 5
    sensor:
      - name: "Powerwall 1 Status"
        unique_id: pw1_status
        value_template: "{{ 'FAULT' if (value_json.PW1_POD_PermanentlyFaulted | int(0) or value_json.PW1_POD_PersistentlyFaulted | int(0) or value_json.PW1_wobble_detected | int(0)) else 'OK' }}"
        json_attributes: [PW1_POD_PermanentlyFaulted, PW1_POD_PersistentlyFaulted, PW1_wobble_detected, PW1_charge_power_clamped, PW1_pinv_state, PW1_pinv_grid_state, PW1_off_grid, PW1_vf_mode, PW1_backup_ready, PW1_POD_ActiveHeating, PW1_POD_enable_line, PW1_POD_ChargeRequest, PW1_POD_ChargeComplete, PW1_POD_DischargeComplete, PW1_POD_nom_energy_remaining, PW1_POD_nom_full_pack_energy, PW1_POD_nom_energy_to_be_charged]
      - name: "Powerwall 2 Status"
        unique_id: pw2_status
        value_template: "{{ 'FAULT' if (value_json.PW2_POD_PermanentlyFaulted | int(0) or value_json.PW2_POD_PersistentlyFaulted | int(0) or value_json.PW2_wobble_detected | int(0)) else 'OK' }}"
        json_attributes: [PW2_POD_PermanentlyFaulted, PW2_POD_PersistentlyFaulted, PW2_wobble_detected, PW2_charge_power_clamped, PW2_pinv_state, PW2_pinv_grid_state, PW2_off_grid, PW2_vf_mode, PW2_backup_ready, PW2_POD_ActiveHeating, PW2_POD_enable_line, PW2_POD_ChargeRequest, PW2_POD_ChargeComplete, PW2_POD_DischargeComplete, PW2_POD_nom_energy_remaining, PW2_POD_nom_full_pack_energy, PW2_POD_nom_energy_to_be_charged]
      - name: "Powerwall 3 Status"
        unique_id: pw3_status
        value_template: "{{ 'FAULT' if (value_json.PW3_POD_PermanentlyFaulted | int(0) or value_json.PW3_POD_PersistentlyFaulted | int(0) or value_json.PW3_wobble_detected | int(0)) else 'OK' }}"
        json_attributes: [PW3_POD_PermanentlyFaulted, PW3_POD_PersistentlyFaulted, PW3_wobble_detected, PW3_charge_power_clamped, PW3_pinv_state, PW3_pinv_grid_state, PW3_off_grid, PW3_vf_mode, PW3_backup_ready, PW3_POD_ActiveHeating, PW3_POD_enable_line, PW3_POD_ChargeRequest, PW3_POD_ChargeComplete, PW3_POD_DischargeComplete, PW3_POD_nom_energy_remaining, PW3_POD_nom_full_pack_energy, PW3_POD_nom_energy_to_be_charged]
      - name: "Powerwall 4 Status"
        unique_id: pw4_status
        value_template: "{{ 'FAULT' if (value_json.PW4_POD_PermanentlyFaulted | int(0) or value_json.PW4_POD_PersistentlyFaulted | int(0) or value_json.PW4_wobble_detected | int(0)) else 'OK' }}"
        json_attributes: [PW4_POD_PermanentlyFaulted, PW4_POD_PersistentlyFaulted, PW4_wobble_detected, PW4_charge_power_clamped, PW4_pinv_state, PW4_pinv_grid_state, PW4_off_grid, PW4_vf_mode, PW4_backup_ready, PW4_POD_ActiveHeating, PW4_POD_enable_line, PW4_POD_ChargeRequest, PW4_POD_ChargeComplete, PW4_POD_DischargeComplete, PW4_POD_nom_energy_remaining, PW4_POD_nom_full_pack_energy, PW4_POD_nom_energy_to_be_charged]
      - name: "Powerwall 5 Status"
        unique_id: pw5_status
        value_template: "{{ 'FAULT' if (value_json.PW5_POD_PermanentlyFaulted | int(0) or value_json.PW5_POD_PersistentlyFaulted | int(0) or value_json.PW5_wobble_detected | int(0)) else 'OK' }}"
        json_attributes: [PW5_POD_PermanentlyFaulted, PW5_POD_PersistentlyFaulted, PW5_wobble_detected, PW5_charge_power_clamped, PW5_pinv_state, PW5_pinv_grid_state, PW5_off_grid, PW5_vf_mode, PW5_backup_ready, PW5_POD_ActiveHeating, PW5_POD_enable_line, PW5_POD_ChargeRequest, PW5_POD_ChargeComplete, PW5_POD_DischargeComplete, PW5_POD_nom_energy_remaining, PW5_POD_nom_full_pack_energy, PW5_POD_nom_energy_to_be_charged]

  # Per-Powerwall output power (kW from the proxy -> W). Cross-reference for the Emporia 3 CTs.
  - resource: http://192.168.10.101:8675/freq
    scan_interval: 30
    timeout: 5
    sensor:
      - name: "Powerwall 1 Output Power"
        unique_id: pw1_output_power
        value_template: "{{ ((value_json.PW1_p_out | float(0)) * 1000) | round(0) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: "Powerwall 2 Output Power"
        unique_id: pw2_output_power
        value_template: "{{ ((value_json.PW2_p_out | float(0)) * 1000) | round(0) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: "Powerwall 3 Output Power"
        unique_id: pw3_output_power
        value_template: "{{ ((value_json.PW3_p_out | float(0)) * 1000) | round(0) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: "Powerwall 4 Output Power"
        unique_id: pw4_output_power
        value_template: "{{ ((value_json.PW4_p_out | float(0)) * 1000) | round(0) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: "Powerwall 5 Output Power"
        unique_id: pw5_output_power
        value_template: "{{ ((value_json.PW5_p_out | float(0)) * 1000) | round(0) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement

  - resource: http://192.168.10.101:8675/api/operation
    scan_interval: 305
    timeout: 5
    sensor:
      - name: "Powerwall Operating Mode"
        unique_id: pw_operating_mode
        value_template: >-
          {% set m = value_json.real_mode %}
          {{ 'Backup-only' if m == 'backup'
             else 'Self-Powered' if m == 'self_consumption'
             else 'Time-Based' if m == 'autonomous'
             else m }}

template:
  # ── Powerwall health checks. State ON = problem (device_class problem shows OK / Problem) ──
  - binary_sensor:
      - name: "Powerwall Capacity Check"
        unique_id: pw_check_capacity
        device_class: problem
        # 5 healthy units ~74 kWh full pack; a missing unit drops ~15 kWh. Adjust 70 if packs age.
        state: "{{ states('sensor.powerwall_full_pack_energy') | float(0) < 70 }}"
      - name: "Powerwall Units Reporting Check"
        unique_id: pw_check_reporting
        device_class: problem
        state: >
          {% set ids = ['sensor.powerwall_1_output_power','sensor.powerwall_2_output_power',
                        'sensor.powerwall_3_output_power','sensor.powerwall_4_output_power',
                        'sensor.powerwall_5_output_power'] %}
          {{ ids | reject('has_value') | list | count > 0 }}
      - name: "Powerwall Balance Check"
        unique_id: pw_check_balance
        device_class: problem
        # Problem if any unit is more than 25% from the average, once average output is over 200 W
        state: >
          {% set v = [states('sensor.powerwall_1_output_power') | float(0),
                      states('sensor.powerwall_2_output_power') | float(0),
                      states('sensor.powerwall_3_output_power') | float(0),
                      states('sensor.powerwall_4_output_power') | float(0),
                      states('sensor.powerwall_5_output_power') | float(0)] %}
          {% set avg = (v | sum) / 5 %}
          {{ avg > 200 and ((v | max) > avg * 1.25 or (v | min) < avg * 0.75) }}
      - name: "Powerwall Gateway Feed Check"
        unique_id: pw_check_feed
        device_class: problem
        state: "{{ not is_state('binary_sensor.powerwall_feed_healthy', 'on') }}"
      - name: "Powerwall Emporia Cross-Check"
        unique_id: pw_check_crosscheck
        device_class: problem
        # Problem if the Emporia feeder total and Tesla battery power differ by more than 25%, once battery power is over 300 W
        state: >
          {% set f = states.sensor | selectattr('name', 'eq', 'Generation Panel Total Power') | map(attribute='state') | list %}
          {% set b = states('sensor.powerwall_battery_power') | float(0) %}
          {% if f | length == 0 or not (f[0] | is_number) %}true
          {% elif b | abs < 300 %}false
          {% else %}{{ ((f[0] | float(0)) - b) | abs / (b | abs) > 0.25 }}
          {% endif %}
  - sensor:
      - name: "Arb grid link"
        unique_id: arb_grid_link
        state: "{{ 'Off-grid (on battery)' if is_state('sensor.arb_740_position','open') else 'On grid' }}"
  - binary_sensor:
      - name: "Arb Islanded"
        unique_id: arb_islanded
        state: "{{ states('sensor.arb_740_position') == 'open' }}"
      - name: "Arb Manual Override"
        unique_id: arb_manual
        state: "{{ states('sensor.arb_740_mode') == 'manual' }}"
  - sensor:
      - name: "Import Price"
        unique_id: import_price
        unit_of_measurement: "USD/kWh"
        state: >
          {% set h = now().hour %}
          {{ states('input_number.arb_free_rate') | float(0) if (9 <= h < 17)
             else states('input_number.arb_paid_rate') | float(0.249) }}
  - sensor:
      - name: "Main Panel Amps"
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        availability: "{{ states('sensor.main_panel_power_minute_average') not in ['unknown', 'unavailable'] }}"
        state: >
          {{ (states('sensor.main_panel_power_minute_average') | float(0) / 240) | round(1) }}
  - sensor:
      - name: "Powerwall Runtime at Load"
        unique_id: pw_runtime_at_load
        unit_of_measurement: h
        state_class: measurement
        icon: mdi:timer-sand
        availability: >
          {{ states('sensor.powerwall_energy_remaining') not in ['unknown','unavailable']
             and states('sensor.powerwall_home_load') not in ['unknown','unavailable'] }}
        state: >
          {% set kwh = states('sensor.powerwall_energy_remaining') | float(0) %}
          {% set load_w = states('sensor.powerwall_home_load') | float(0) %}
          {{ (kwh / (load_w / 1000)) | round(1) if load_w > 0 else 0 }}
      - name: "Electricity Period"
        unique_id: electricity_period
        icon: mdi:clock-outline
        state: >
          {% set h = now().hour %}
          {{ 'Free' if (9 <= h < 17) else 'Paid' }}   {# Free Days 12 #}
      - name: "Arbitrage Savings (Today)"
        unique_id: arb_savings_today
        unit_of_measurement: "USD"
        device_class: monetary
        state_class: total
        icon: mdi:cash-fast
        state: >
          {{ (states('sensor.battery_discharge_daily_peak') | float(0)
              * (states('input_number.arb_paid_rate') | float(0.249))) | round(2) }}
      - name: "Arbitrage Savings (Month)"
        unique_id: arb_savings_month
        unit_of_measurement: "USD"
        device_class: monetary
        state_class: total
        icon: mdi:cash
        state: >
          {{ (states('sensor.battery_discharge_tou_peak') | float(0)
              * (states('input_number.arb_paid_rate') | float(0.249))) | round(2) }}
      - name: "Grid Import Power"
        unique_id: grid_import_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ [states('sensor.powerwall_grid_power') | float(0), 0] | max }}"
      - name: "Grid Export Power"
        unique_id: grid_export_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ [ -(states('sensor.powerwall_grid_power') | float(0)), 0] | max }}"
      - name: "Battery Discharge Power"
        unique_id: battery_discharge_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ [states('sensor.powerwall_battery_power') | float(0), 0] | max }}"
      - name: "Battery Charge Power"
        unique_id: battery_charge_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ [ -(states('sensor.powerwall_battery_power') | float(0)), 0] | max }}"
  - trigger:
      - platform: time_pattern
        seconds: "/30"
    binary_sensor:
      - name: "Powerwall Feed Healthy"
        unique_id: pw_feed_healthy
        device_class: connectivity          # shows Connected / Disconnected
        state: >
          {{ states('sensor.powerwall_grid_power') not in ['unknown','unavailable']
             and (now() - states.sensor.powerwall_grid_power.last_reported).total_seconds() < 120 }}
    sensor:
      - name: "Powerwall Feed Age"
        unique_id: pw_feed_age
        unit_of_measurement: s
        state_class: measurement
        icon: mdi:timer-alert-outline
        state: >
          {{ (now() - states.sensor.powerwall_grid_power.last_reported).total_seconds() | int }}

# Integrate power (W) -> energy (kWh). TEDAPI has no lifetime counters, so HA
# accumulates them itself from the directional power sensors above.
sensor:
  - platform: integration
    source: sensor.grid_import_power
    name: "Grid Imported"
    unit_prefix: k
    unit_time: h
    method: left
    max_sub_interval:
      minutes: 1
  - platform: integration
    source: sensor.grid_export_power
    name: "Grid Exported"
    unit_prefix: k
    unit_time: h
    method: left
    max_sub_interval:
      minutes: 1
  - platform: integration
    source: sensor.battery_discharge_power
    name: "Battery Discharged"
    unit_prefix: k
    unit_time: h
    method: left
    max_sub_interval:
      minutes: 1
  - platform: integration
    source: sensor.battery_charge_power
    name: "Battery Charged"
    unit_prefix: k
    unit_time: h
    method: left
    max_sub_interval:
      minutes: 1

utility_meter:
  # Free Days 12: two buckets only. "peak" = the PAID window (5pm-9am),
  # "free" = 9am-5pm. Switched by the "TOU tariff" automations.
  grid_import_tou:
    source: sensor.grid_imported
    cycle: monthly
    tariffs:
      - peak
      - free
  battery_discharge_tou:
    source: sensor.battery_discharged
    cycle: monthly
    tariffs:
      - peak
      - free
  battery_discharge_daily:
    source: sensor.battery_discharged
    cycle: daily
    tariffs:
      - peak
      - free

# ───────────────────────────────────────────────────────────────────────────
# ADD THESE TWO to automations.yaml (NOT here — automation is !include'd above).
# Append each as a top-level list item.
#
# Times are pushed to the controller by the Apply-times button (script.arb_apply_times);
# this one just re-syncs after an HA restart.
# - alias: "Arb push config on HA start"
#   trigger:
#     - platform: homeassistant
#       event: start
#   action:
#     - delay: "00:00:10"
#     - service: rest_command.arb_config
#
# Flip the TOU buckets: free 9am-5pm, paid (peak) 5pm-9am. Self-corrects on restart.
# - alias: "TOU tariff switch"
#   trigger:
#     - platform: time
#       at: "09:00:00"
#     - platform: time
#       at: "17:00:00"
#     - platform: homeassistant
#       event: start
#   action:
#     - variables:
#         tar: "{{ 'free' if (9 <= now().hour < 17) else 'peak' }}"
#     - service: select.select_option
#       target:
#         entity_id:
#           - select.grid_import_tou
#           - select.battery_discharge_tou
#           - select.battery_discharge_daily
#       data:
#         option: "{{ tar }}"
